<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MD/MDX Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg:          #09090b;
      --bg-card:     #0f0f11;
      --bg-el:       #18181b;
      --bg-hover:    #1c1c1f;
      --border:      #27272a;
      --border-hi:   #3f3f46;
      --muted:       #3f3f46;
      --muted-fg:    #71717a;
      --fg:          #fafafa;
      --fg-soft:     #a1a1aa;
      --fg-softer:   #52525b;
      --primary:     #6366f1;
      --primary-dim: rgba(99,102,241,.12);
      --green:       #22c55e;
      --green-dim:   rgba(34,197,94,.1);
      --yellow:      #eab308;
      --yellow-dim:  rgba(234,179,8,.1);
      --red:         #ef4444;
      --red-dim:     rgba(239,68,68,.1);
      --blue:        #3b82f6;
      --blue-dim:    rgba(59,130,246,.1);
      --r:           8px;
      --rl:          12px;
      --rxl:         16px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--muted);border-radius:99px}

    /* ── HEADER ── */
    header{background:rgba(9,9,11,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
    .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;letter-spacing:-.01em}
    .logo-box{width:28px;height:28px;background:var(--primary-dim);border:1px solid rgba(99,102,241,.3);border-radius:7px;display:flex;align-items:center;justify-content:center}
    .hsep{width:1px;height:20px;background:var(--border)}
    #fbadge{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted-fg);background:var(--bg-el);border:1px solid var(--border);padding:3px 10px;border-radius:99px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .2s}
    #fbadge.on{color:var(--fg-soft);border-color:var(--border-hi)}
    .bdot{width:6px;height:6px;border-radius:50%;background:var(--muted-fg);flex-shrink:0;transition:background .2s}
    #fbadge.on .bdot{background:var(--green)}
    .hright{margin-left:auto;display:flex;align-items:center;gap:8px}

    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);font-size:.82rem;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;line-height:1}
    .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
    .btn-primary:hover{background:#4f52d9}
    .btn-ghost{background:transparent;color:var(--fg-soft);border-color:var(--border)}
    .btn-ghost:hover{background:var(--bg-el);color:var(--fg);border-color:var(--border-hi)}
    .btn:active{transform:scale(.98)}

    /* ── DROP ZONE ── */
    #drop-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .drop-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rxl);padding:48px 56px;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:440px;width:100%;transition:border-color .2s,box-shadow .2s}
    .drop-card.drag-over{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-dim)}
    .drop-icon{width:72px;height:72px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);display:flex;align-items:center;justify-content:center;transition:all .2s}
    .drop-card.drag-over .drop-icon{background:var(--primary-dim);border-color:rgba(99,102,241,.4)}
    .drop-title{font-size:1.05rem;font-weight:600;letter-spacing:-.02em;text-align:center}
    .drop-sub{font-size:.82rem;color:var(--muted-fg);text-align:center;line-height:1.5}
    .drop-div{display:flex;align-items:center;gap:12px;width:100%;color:var(--fg-softer);font-size:.75rem}
    .drop-div::before,.drop-div::after{content:'';flex:1;height:1px;background:var(--border)}
    .fmts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .ftag{background:var(--bg-el);border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--fg-soft)}
    #file-input{display:none}

    /* ── CONTENT ── */
    #content-wrapper{display:none;flex:1;padding:32px 24px 64px;max-width:900px;width:100%;margin:0 auto}

    /* ── TOOLBAR ── */
    .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
    .tleft{display:flex;gap:8px}
    .stats{margin-left:auto;display:flex;gap:16px;align-items:center}
    .sv{font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
    .sl{font-size:.7rem;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em}
    .ssep{width:1px;height:28px;background:var(--border)}

    /* ── MDX NOTICE ── */
    .mdx-notice{display:none;align-items:center;gap:10px;background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.2);border-radius:var(--r);padding:10px 14px;margin-bottom:20px;font-size:.8rem;color:#ca8a04}
    .mdx-notice.on{display:flex}

    /* ── MARKDOWN BASE ── */
    .md{line-height:1.75;color:var(--fg-soft)}
    .md>*+*{margin-top:.9em}
    .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{color:var(--fg);font-weight:600;letter-spacing:-.02em;line-height:1.3}
    .md h1{font-size:1.9rem;margin-top:2rem;padding-bottom:.5em;border-bottom:1px solid var(--border)}
    .md h2{font-size:1.45rem;margin-top:1.8rem;padding-bottom:.4em;border-bottom:1px solid var(--border)}
    .md h3{font-size:1.15rem;margin-top:1.5rem}
    .md h4{font-size:1rem;margin-top:1.2rem}
    .md p{margin:.8em 0}
    .md a{color:var(--primary);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
    .md a:hover{border-bottom-color:var(--primary)}
    .md strong{color:var(--fg);font-weight:600}
    .md em{font-style:italic}
    .md ul,.md ol{padding-left:1.6em}
    .md li{margin:.3em 0}
    .md li::marker{color:var(--muted-fg)}
    .md code{font-family:'JetBrains Mono',monospace;font-size:.83em;background:var(--bg-el);border:1px solid var(--border);border-radius:5px;padding:2px 6px;color:#f472b6}
    .md pre{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rl);padding:20px;overflow-x:auto;margin:1.2em 0}
    .md pre code{background:none;border:none;padding:0;color:inherit;font-size:.85em;line-height:1.65}
    .md blockquote{border-left:3px solid var(--primary);padding:12px 18px;margin:1.2em 0;background:var(--primary-dim);border-radius:0 var(--r) var(--r) 0;color:var(--fg-soft);font-style:italic}
    .md blockquote p{margin:0}
    .md table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:.88rem;border-radius:var(--rl);overflow:hidden;border:1px solid var(--border)}
    .md th{background:var(--bg-el);color:var(--fg);padding:10px 14px;text-align:left;font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
    .md td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--fg-soft)}
    .md tr:last-child td{border-bottom:none}
    .md tr:hover td{background:var(--bg-hover)}
    .md hr{border:none;border-top:1px solid var(--border);margin:2em 0}
    .md img{max-width:100%;border-radius:var(--rl);border:1px solid var(--border)}
    .md details{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:0;margin:.8em 0;overflow:hidden}
    .md details summary{padding:12px 16px;cursor:pointer;font-weight:500;color:var(--fg);user-select:none;list-style:none;display:flex;align-items:center;gap:8px}
    .md details summary::before{content:'▶';font-size:.7rem;color:var(--muted-fg);transition:transform .2s;flex-shrink:0}
    .md details[open] summary::before{transform:rotate(90deg)}
    .md details summary::-webkit-details-marker{display:none}
    .md details>*:not(summary){padding:0 16px 16px}

    /* ── MDX COMPONENTS ── */

    /* Callout */
    .mdx-callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);margin:1em 0;border:1px solid}
    .mdx-callout.info{background:var(--blue-dim);border-color:rgba(59,130,246,.25);color:#93c5fd}
    .mdx-callout.warning{background:var(--yellow-dim);border-color:rgba(234,179,8,.25);color:#fde047}
    .mdx-callout.error{background:var(--red-dim);border-color:rgba(239,68,68,.25);color:#fca5a5}
    .mdx-callout.tip{background:var(--green-dim);border-color:rgba(34,197,94,.25);color:#86efac}
    .mdx-callout-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
    .mdx-callout-body{font-size:.88rem;line-height:1.6;color:inherit}
    .mdx-callout-body p{margin:.3em 0}

    /* ProgressBar */
    .mdx-progress{margin:1em 0}
    .mdx-progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .mdx-progress-label{font-size:.82rem;font-weight:500;color:var(--fg-soft)}
    .mdx-progress-val{font-size:.82rem;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums}
    .mdx-progress-track{height:8px;background:var(--bg-el);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
    .mdx-progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#818cf8);transition:width .6s ease}

    /* Tabs */
    .mdx-tabs{margin:1em 0;border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
    .mdx-tabs-nav{display:flex;background:var(--bg-el);border-bottom:1px solid var(--border);overflow-x:auto;gap:0}
    .mdx-tab-btn{padding:10px 18px;font-size:.82rem;font-weight:500;color:var(--muted-fg);background:transparent;border:none;cursor:pointer;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
    .mdx-tab-btn:hover{color:var(--fg-soft);background:var(--bg-hover)}
    .mdx-tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:transparent}
    .mdx-tab-content{display:none;padding:20px}
    .mdx-tab-content.active{display:block}

    /* StatusBadge */
    .mdx-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600;letter-spacing:.03em;vertical-align:middle;margin-left:8px;border:1px solid}
    .mdx-badge.completed{background:var(--green-dim);color:var(--green);border-color:rgba(34,197,94,.25)}
    .mdx-badge.in-progress{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(234,179,8,.25)}
    .mdx-badge.todo{background:var(--bg-el);color:var(--muted-fg);border-color:var(--border)}
    .mdx-badge.blocked{background:var(--red-dim);color:var(--red);border-color:rgba(239,68,68,.25)}
    .badge-pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* TaskList */
    .mdx-tasklist{list-style:none;padding:0;margin:.6em 0;display:flex;flex-direction:column;gap:6px}
    .mdx-tasklist li{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;color:var(--fg-soft);padding:6px 10px;border-radius:var(--r);transition:background .15s}
    .mdx-tasklist li:hover{background:var(--bg-hover)}
    .mdx-tasklist li.done{color:var(--fg-softer)}
    .mdx-tasklist li.done span{text-decoration:line-through}
    .task-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-hi);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
    .task-check.done{background:var(--green);border-color:var(--green)}
    .mdx-tasklist ul{list-style:none;padding:0;margin:.4em 0 0 26px;display:flex;flex-direction:column;gap:4px}
    .mdx-tasklist ul li{font-size:.83rem}

    /* Timeline */
    .mdx-timeline{margin:1em 0;display:flex;flex-direction:column;gap:0;position:relative;padding-left:28px}
    .mdx-timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--primary),var(--border));border-radius:99px}
    .mdx-timeline-item{position:relative;padding:0 0 24px 20px}
    .mdx-timeline-item:last-child{padding-bottom:0}
    .mdx-timeline-dot{position:absolute;left:-21px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--primary);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--primary)}
    .mdx-timeline-date{font-size:.75rem;font-weight:600;color:var(--primary);font-family:'JetBrains Mono',monospace;margin-bottom:8px;letter-spacing:.03em}
    .mdx-timeline-body{font-size:.88rem;color:var(--fg-soft);line-height:1.65}
    .mdx-timeline-body p{margin:.4em 0}
    .mdx-timeline-body ul{padding-left:1.4em}
    .mdx-timeline-body h4{color:var(--fg);font-size:.9rem;margin:.8em 0 .3em}

    /* Unknown component fallback */
    .mdx-unknown{background:var(--bg-el);border:1px dashed var(--border-hi);border-radius:var(--r);padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted-fg);margin:.8em 0}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:24px;right:24px;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--rl);padding:12px 18px;font-size:.82rem;color:var(--fg);display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(80px);opacity:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);z-index:999;pointer-events:none}
    #toast.show{transform:translateY(0);opacity:1}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    </div>
    MD · MDX Viewer
  </div>
  <div class="hsep"></div>
  <div id="fbadge"><span class="bdot"></span><span id="fbadge-text">Aucun fichier ouvert</span></div>
  <div class="hright">
    <button class="btn btn-ghost" id="btn-open" style="display:none" onclick="document.getElementById('file-input').click()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Ouvrir
    </button>
  </div>
  <input type="file" id="file-input" accept=".md,.mdx,.markdown"/>
</header>

<div id="drop-zone">
  <div class="drop-card" id="drop-card">
    <div class="drop-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <p class="drop-title">Dépose ton fichier ici</p>
      <p class="drop-sub">Glisse-dépose ou clique pour parcourir</p>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Parcourir les fichiers
    </button>
    <div class="drop-div">formats acceptés</div>
    <div class="fmts">
      <span class="ftag">.md</span>
      <span class="ftag">.mdx</span>
      <span class="ftag">.markdown</span>
    </div>
  </div>
</div>

<div id="content-wrapper">
  <div class="toolbar">
    <div class="tleft">
      <button class="btn btn-ghost" onclick="resetViewer()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour
      </button>
      <button class="btn btn-ghost" onclick="copyRaw()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copier brut
      </button>
    </div>
    <div class="stats">
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px">
        <span class="sv" id="sw">—</span><span class="sl">Mots</span>
      </div>
      <div class="ssep"></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px">
        <span class="sv" id="sl">—</span><span class="sl">Lignes</span>
      </div>
      <div class="ssep"></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px">
        <span class="sv" id="sc">—</span><span class="sl">Chars</span>
      </div>
    </div>
  </div>
  <div class="mdx-notice" id="mdx-notice">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Fichier <strong style="margin:0 3px">.mdx</strong> — composants Nextra/custom rendus visuellement.
  </div>
  <div class="md" id="md-output"></div>
</div>

<div id="toast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg"></span>
</div>

<script>
let rawContent = '';

// ── MARKED ──
marked.setOptions({
  highlight:(code,lang)=>{
    if(lang&&hljs.getLanguage(lang))return hljs.highlight(code,{language:lang}).value;
    return hljs.highlightAuto(code).value;
  },
  breaks:true, gfm:true
});

// ════════════════════════════════════════
//  MDX PARSER — transforme le MDX en HTML
// ════════════════════════════════════════

function parseMdx(src) {
  // 1) Supprimer les commentaires JSX {/* ... */}
  src = src.replace(/\{\/\*[\s\S]*?\*\/\}/g, '');

  // 2) Supprimer les export default
  src = src.replace(/^export\s+default[\s\S]*$/m, '');

  // 3) Supprimer les lignes import/export
  src = src.replace(/^(import|export)\s.+$/gm, '');

  // 4) Parser les blocs de composants (récursif)
  src = parseComponents(src);

  return src;
}

// ── Extrait le contenu d'un tag JSX (gère l'imbrication) ──
function extractTag(src, tagName, startIdx) {
  const openRe  = new RegExp(`<${tagName}(\\s[^>]*)?>`, 'g');
  const closeRe = new RegExp(`<\\/${tagName}>`, 'g');
  openRe.lastIndex  = startIdx;
  closeRe.lastIndex = startIdx;

  let depth = 1;
  let pos   = startIdx;
  const tagLen = tagName.length + 2; // <Tag>

  // avance après le premier tag ouvrant
  const firstClose = src.indexOf('>', startIdx);
  if(firstClose === -1) return null;
  pos = firstClose + 1;

  while(depth > 0 && pos < src.length) {
    const nextOpen  = src.indexOf(`<${tagName}`, pos);
    const nextClose = src.indexOf(`</${tagName}>`, pos);
    if(nextClose === -1) break;

    if(nextOpen !== -1 && nextOpen < nextClose) {
      depth++;
      pos = nextOpen + tagLen;
    } else {
      depth--;
      if(depth === 0) {
        return { end: nextClose + tagName.length + 3, inner: src.slice(firstClose+1, nextClose) };
      }
      pos = nextClose + tagName.length + 3;
    }
  }
  return null;
}

// ── Lit les attributs d'un tag JSX ──
function getAttrs(tagStr) {
  const attrs = {};
  // type="value" ou type='value'
  const strRe = /(\w+)=["']([^"']*)["']/g;
  let m;
  while((m=strRe.exec(tagStr))!==null) attrs[m[1]]=m[2];
  // value={15}
  const numRe = /(\w+)=\{([^}]+)\}/g;
  while((m=numRe.exec(tagStr))!==null) attrs[m[1]]=m[2].trim();
  // items={['a','b']}
  const arrRe = /(\w+)=\{\[([^\]]+)\]\}/g;
  while((m=arrRe.exec(tagStr))!==null){
    attrs[m[1]] = m[2].split(',').map(s=>s.trim().replace(/^['"]|['"]$/g,''));
  }
  // emoji="💡"
  const emoRe = /emoji=["']([^"']*)["']/g;
  while((m=emoRe.exec(tagStr))!==null) attrs['emoji']=m[1];
  return attrs;
}

// ── Rendu de chaque composant ──
function renderCallout(attrs, inner) {
  const type = (attrs.type||'info').toLowerCase();
  const icons = {info:'ℹ️', warning:'⚠️', error:'🚨', tip:'💡'};
  const icon = attrs.emoji || icons[type] || 'ℹ️';
  const body = marked.parse(inner.trim());
  return `<div class="mdx-callout ${type}"><span class="mdx-callout-icon">${icon}</span><div class="mdx-callout-body">${body}</div></div>`;
}

function renderProgressBar(attrs) {
  const val   = parseFloat(attrs.value||0);
  const max   = parseFloat(attrs.max||100);
  const label = attrs.label||'Progression';
  const pct   = Math.min(100, Math.round((val/max)*100));
  return `<div class="mdx-progress">
    <div class="mdx-progress-header">
      <span class="mdx-progress-label">${label}</span>
      <span class="mdx-progress-val">${pct}%</span>
    </div>
    <div class="mdx-progress-track">
      <div class="mdx-progress-fill" style="width:${pct}%"></div>
    </div>
  </div>`;
}

function renderStatusBadge(attrs) {
  const s = (attrs.status||'todo').toLowerCase().replace(/[^a-z-]/g,'');
  const labels = {'in-progress':'En cours','completed':'Terminé','todo':'À faire','blocked':'Bloqué'};
  const pulse = s==='in-progress' ? '<span class="badge-pulse"></span>' : '';
  return `<span class="mdx-badge ${s}">${pulse}${labels[s]||s}</span>`;
}

function renderTaskList(inner) {
  // parse les lignes - [x] et - [ ]
  const lines = inner.split('\n');
  let html = '<ul class="mdx-tasklist">';
  let depth = 0;
  for(let line of lines) {
    const indent = line.match(/^(\s*)/)[1].length;
    const doneMatch = line.match(/^\s*-\s*\[x\]\s*(.*)/i);
    const todoMatch = line.match(/^\s*-\s*\[\s*\]\s*(.*)/);
    if(doneMatch) {
      const check = `<span class="task-check done"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>`;
      html += `<li class="done">${check}<span>${marked.parseInline(doneMatch[1])}</span></li>`;
    } else if(todoMatch) {
      const check = `<span class="task-check"></span>`;
      html += `<li>${check}<span>${marked.parseInline(todoMatch[1])}</span></li>`;
    }
  }
  html += '</ul>';
  return html;
}

function renderTabs(attrs, inner) {
  const items = attrs.items || [];
  // extraire les <Tab>...</Tab>
  const tabContents = [];
  let rest = inner;
  let m;
  const tabRe = /<Tab>([\s\S]*?)<\/Tab>/g;
  while((m=tabRe.exec(inner))!==null) tabContents.push(m[1]);

  const id = 'tabs-' + Math.random().toString(36).slice(2,7);
  let nav = '<div class="mdx-tabs-nav">';
  let content = '';
  items.forEach((label,i)=>{
    const active = i===0?'active':'';
    nav += `<button class="mdx-tab-btn ${active}" onclick="switchTab('${id}',${i})">${label}</button>`;
    const body = tabContents[i] ? parseComponents(tabContents[i]) : '';
    content += `<div class="mdx-tab-content ${active}" id="${id}-${i}">${marked.parse(body.trim())}</div>`;
  });
  nav += '</div>';
  return `<div class="mdx-tabs" id="${id}">${nav}${content}</div>`;
}

function renderTimeline(inner) {
  // extraire les <Timeline.Item date="...">...</Timeline.Item>
  let html = '<div class="mdx-timeline">';
  const itemRe = /<Timeline\.Item\s+date=["']([^"']*)["']>([\s\S]*?)<\/Timeline\.Item>/g;
  let m;
  while((m=itemRe.exec(inner))!==null) {
    const date = m[1];
    const body = marked.parse(m[2].trim());
    html += `<div class="mdx-timeline-item">
      <div class="mdx-timeline-dot"></div>
      <div class="mdx-timeline-date">${date}</div>
      <div class="mdx-timeline-body">${body}</div>
    </div>`;
  }
  html += '</div>';
  return html;
}

// ── Parcourt le source et remplace les composants connus ──
function parseComponents(src) {
  // On traite les composants de l'extérieur vers l'intérieur
  const knownBlock = ['Tabs','Timeline','Callout','TaskList'];
  const knownInline = ['ProgressBar','StatusBadge'];

  // Self-closing inline
  src = src.replace(/<ProgressBar([^>]*)\/>/g, (_,a)=>renderProgressBar(getAttrs(a)));
  src = src.replace(/<StatusBadge([^>]*)\/>/g, (_,a)=>renderStatusBadge(getAttrs(a)));

  // Block components — on fait plusieurs passes pour gérer l'imbrication
  for(let pass=0; pass<4; pass++) {
    src = replaceBlock(src, 'Callout',  (a,i)=>renderCallout(getAttrs(a),i));
    src = replaceBlock(src, 'TaskList', (a,i)=>renderTaskList(i));
    src = replaceBlock(src, 'Tabs',     (a,i)=>renderTabs(getAttrs(a),i));
    src = replaceBlock(src, 'Timeline', (a,i)=>renderTimeline(i));
  }

  return src;
}

function replaceBlock(src, tag, renderer) {
  const re = new RegExp(`<${tag}(\\s[^>]*)?>`, 'g');
  let result = '';
  let lastIdx = 0;
  let m;
  while((m=re.exec(src))!==null) {
    const start = m.index;
    const attrStr = m[1]||'';
    const closeTag = `</${tag}>`;
    // find matching close (simple, non-nested for now)
    let depth=1, pos=m.index+m[0].length;
    const openStr=`<${tag}`;
    while(depth>0&&pos<src.length){
      const nOpen=src.indexOf(openStr,pos);
      const nClose=src.indexOf(closeTag,pos);
      if(nClose===-1)break;
      if(nOpen!==-1&&nOpen<nClose){depth++;pos=nOpen+openStr.length;}
      else{depth--;if(depth===0){
        const inner=src.slice(m.index+m[0].length,nClose);
        result+=src.slice(lastIdx,start)+renderer(attrStr,inner);
        lastIdx=nClose+closeTag.length;
        re.lastIndex=lastIdx;
        break;
      }pos=nClose+closeTag.length;}
    }
  }
  result+=src.slice(lastIdx);
  return result;
}

// ── Tab switcher ──
window.switchTab = function(id, idx) {
  const wrap = document.getElementById(id);
  wrap.querySelectorAll('.mdx-tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  wrap.querySelectorAll('.mdx-tab-content').forEach((c,i)=>c.classList.toggle('active',i===idx));
};

// ════════════════════════════════════════
//  LOAD FILE
// ════════════════════════════════════════
function loadFile(text, filename) {
  rawContent = text;
  const isMdx = /\.(mdx)$/i.test(filename);

  let processed = isMdx ? parseMdx(text) : text;
  const html = marked.parse(processed);
  document.getElementById('md-output').innerHTML = html;

  // stats
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('sw').textContent = words.toLocaleString('fr');
  document.getElementById('sl').textContent = text.split('\n').length.toLocaleString('fr');
  document.getElementById('sc').textContent = text.length.toLocaleString('fr');

  // badge
  document.getElementById('fbadge-text').textContent = filename;
  document.getElementById('fbadge').classList.add('on');
  document.getElementById('mdx-notice').classList.toggle('on', isMdx);

  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('content-wrapper').style.display = 'block';
  document.getElementById('btn-open').style.display = 'inline-flex';

  document.querySelectorAll('pre code').forEach(el=>hljs.highlightElement(el));
  showToast(`${filename} chargé`);
}

function resetViewer() {
  document.getElementById('drop-zone').style.display = 'flex';
  document.getElementById('content-wrapper').style.display = 'none';
  document.getElementById('btn-open').style.display = 'none';
  document.getElementById('fbadge-text').textContent = 'Aucun fichier ouvert';
  document.getElementById('fbadge').classList.remove('on');
  document.getElementById('file-input').value = '';
  rawContent = '';
}

function copyRaw() {
  navigator.clipboard.writeText(rawContent).then(()=>showToast('Texte brut copié !'));
}

let toastT;
function showToast(msg) {
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2400);
}

document.getElementById('file-input').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>loadFile(ev.target.result,f.name);
  r.readAsText(f,'UTF-8');
});

const card=document.getElementById('drop-card');
const zone=document.getElementById('drop-zone');
['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();card.classList.add('drag-over')}));
['dragleave','dragend'].forEach(ev=>zone.addEventListener(ev,()=>card.classList.remove('drag-over')));
zone.addEventListener('drop',e=>{
  e.preventDefault(); card.classList.remove('drag-over');
  const f=e.dataTransfer.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>loadFile(ev.target.result,f.name);
  r.readAsText(f,'UTF-8');
});
</script>
